name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        run: gradle :app:assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk RO-Builds-v1.0.${{ github.run_number }}.apk

      - name: Publicar na página Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RO Builds v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: RO-Builds-v1.0.${{ github.run_number }}.apk
          make_latest: true
